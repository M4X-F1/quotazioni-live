<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotazioni e Calcolo Oro e Argento Live</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 100%;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .header h2 { margin: 0; font-size: 1.25rem; color: #1a1a1a; }
        .badge-live {
            background-color: #e6f4ea;
            color: #137333;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #137333;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; }
        th { font-size: 0.8rem; text-transform: uppercase; color: #777; }
        td.prezzo {
            text-align: right;
            font-weight: bold;
            color: #b8860b;
            font-size: 1.05rem;
            transition: background-color 0.4s ease;
        }
        td.argento { color: #607d8b; }
        .prezzo-cambiato {
            background-color: #fff3cd;
            border-radius: 4px;
        }
        .stato { text-align: center; padding: 20px; color: #666; font-size: 0.9rem; }
        .calcolatore {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 2px solid #f0f0f0;
        }
        .calcolatore h3 {
            margin: 0 0 12px 0;
            font-size: 1rem;
            color: #1a1a1a;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .form-group select, .form-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #333;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group select:focus, .form-group input:focus {
            border-color: #b8860b;
            background-color: #fff;
        }
        .risultato-box {
            background-color: #fdfbf2;
            border: 1px solid #f0e4b8;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .risultato-label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 600;
        }
        .risultato-valore {
            font-size: 1.4rem;
            font-weight: bold;
            color: #b8860b;
        }
        .footer {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Quotazioni Metalli</h2>
        <span class="badge-live"><span class="dot"></span> LIVE 1s</span>
    </div>

    <div id="contenuto">
        <div class="stato">Connessione al feed in tempo reale...</div>
    </div>

    <div class="calcolatore">
        <h3>Calcola il valore in tempo reale</h3>
        <div class="calc-grid">
            <div class="form-group">
                <label for="select-metallo">Metallo / Titolo</label>
                <select id="select-metallo" onchange="aggiornaCalcolo()">
                    <option value="">Caricamento...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="input-grammi">Peso (grammi)</label>
                <input type="number" id="input-grammi" placeholder="Es. 10" min="0" step="0.01" oninput="aggiornaCalcolo()">
            </div>
        </div>
        <div class="risultato-box">
            <span class="risultato-label">Valore stimato:</span>
            <span class="risultato-valore" id="valore-totale">0,00 €</span>
        </div>
    </div>

    <div class="footer" id="aggiornamento">Inizializzazione...</div>
</div>

<script>
    const WORKER_URL = "https://tight-smoke-037bprezzi-oro.cappolifabrizio.workers.dev/";
    let prezziPrecedenti = new Map();
    let prezziNumerici = new Map();
    let inCorso = false;

    function aggiornaCalcolo() {
        const select = document.getElementById('select-metallo');
        const inputGrammi = document.getElementById('input-grammi');
        const boxTotale = document.getElementById('valore-totale');

        const chiaveSelezionata = select.value;
        const grammi = parseFloat(inputGrammi.value);

        if (!chiaveSelezionata || isNaN(grammi) || grammi <= 0) {
            boxTotale.textContent = "0,00 €";
            return;
        }

        const prezzoAlGrammo = prezziNumerici.get(chiaveSelezionata) || 0;
        const totale = grammi * prezzoAlGrammo;

        boxTotale.textContent = totale.toLocaleString('it-IT', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + " €";
    }

    async function caricaQuotazioni() {
        if (inCorso) return;
        inCorso = true;

        const contenitore = document.getElementById('contenuto');
        const infoAggiornamento = document.getElementById('aggiornamento');
        const selectMetallo = document.getElementById('select-metallo');

        try {
            const response = await fetch(WORKER_URL + "?t=" + Date.now());
            if (!response.ok) throw new Error('HTTP ' + response.status);
            
            const html = await response.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const testoPagina = doc.body.textContent || "";

            const regex = /(ORO|ARGENTO)\s+([0-9]+(?:KT|‰)?)\s*[·•|-]\s*([0-9]+,[0-9]+\s*€\/g)/gi;
            const risultati = new Map();
            let match;

            while ((match = regex.exec(testoPagina)) !== null) {
                const [, metalloRaw, titoloRaw, prezzoRaw] = match;
                const metallo = metalloRaw.toUpperCase();
                const titolo = titoloRaw.toUpperCase();
                const prezzo = prezzoRaw.trim();
                const chiave = `${metallo} ${titolo}`;

                if (!risultati.has(chiave)) {
                    risultati.set(chiave, { metallo, titolo, prezzo });
                    const numero = parseFloat(prezzo.replace('€/g', '').trim().replace(',', '.'));
                    if (!isNaN(numero)) {
                        prezziNumerici.set(chiave, numero);
                    }
                }
            }

            if (risultati.size > 0) {
                const selezioneAttuale = selectMetallo.value;
                let opzioniSelect = "";

                let tabellaHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Metallo / Titolo</th>
                                <th style="text-align: right;">Quotazione</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                risultati.forEach((valore, chiave) => {
                    const vecchioPrezzo = prezziPrecedenti.get(chiave);
                    const isCambiato = vecchioPrezzo && vecchioPrezzo !== valore.prezzo;
                    const classeColore = valore.metallo === 'ARGENTO' ? 'prezzo argento' : 'prezzo';
                    const classeFlash = isCambiato ? 'prezzo-cambiato' : '';

                    tabellaHTML += `
                        <tr>
                            <td><strong>${valore.metallo}</strong> ${valore.titolo}</td>
                            <td class="${classeColore} ${classeFlash}">${valore.prezzo}</td>
                        </tr>
                    `;
                    prezziPrecedenti.set(chiave, valore.prezzo);

                    const selected = (chiave === selezioneAttuale) ? 'selected' : '';
                    opzioniSelect += `<option value="${chiave}" ${selected}>${chiave} (${valore.prezzo})</option>`;
                });

                tabellaHTML += `</tbody></table>`;
                contenitore.innerHTML = tabellaHTML;

                selectMetallo.innerHTML = opzioniSelect;
                aggiornaCalcolo();
            }

            const ora = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            infoAggiornamento.textContent = `Aggiornato al secondo: ${ora}`;

        } catch (errore) {
            console.error(errore);
            infoAggiornamento.textContent = "Riconnessione in corso...";
        } finally {
            inCorso = false;
        }
    }

    caricaQuotazioni();
    setInterval(caricaQuotazioni, 1000);
</script>

</body>
</html>
